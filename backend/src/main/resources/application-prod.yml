# 生产环境配置
spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql-server:3306/rule_engine?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      auto-commit: true
      idle-timeout: 30000
      pool-name: RuleEngineHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis配置
  redis:
    host: ${REDIS_HOST:redis-server}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 10
        min-idle: 5

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200
  header: Authorization

# Drools配置
drools:
  enabled: true
  path: drools/
  mode: STREAM
  update: true

# 日志配置
logging:
  file:
    name: /var/log/rule-engine/application.log
  level:
    com.example.ruleengine: info
    com.example.ruleengine.mapper: warn
