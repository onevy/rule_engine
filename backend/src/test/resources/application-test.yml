# 测试环境配置
spring:
  # 数据源配置 - 使用H2内存数据库
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:rule_engine_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      auto-commit: true

  # H2控制台（调试时可用）
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  # Redis配置 - 禁用
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

  # 初始化SQL
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data-test.sql

# JWT配置
jwt:
  secret: TestSecretKeyForJWTMustBeLongEnoughAndSecure123456
  expiration: 3600
  header: Authorization

# Drools配置
drools:
  enabled: false
  path: drools/
  mode: STREAM
  update: false

# 日志
logging:
  level:
    com.example.ruleengine: debug
    org.springframework.jdbc: debug
